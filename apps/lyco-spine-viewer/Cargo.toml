[package]
name = "lyco-spine-viewer"
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Spine 3.8 skeleton previewer: load an atlas/skel pair, play animations, export a frame or a GIF"

# Same licence warning as lyco-spine-render: this binary links the official
# Spine runtime through it, so shipping it needs a Spine licence of your own.
#
# Standalone workspace on purpose, like tiny_lilyco_uda: the GUI stack (tao +
# wry) is Windows-only-ish and heavy, and the headless lyco-ai-toolkit CI must
# never pay a network round-trip or a system dependency for it.
[workspace]

[dependencies]
lyco-spine-render = { path = "../../crates/lyco-spine-render" }
image = "0.25"
anyhow = "1"
serde_json = "1"
# Same versions as the tiny-agent-wry GUI already ships, so the dependency
# graph is known-good on Windows CI.
tao = "0.37"
wry = "0.57"

[[bin]]
name = "lyco-spine-viewer"
path = "src/main.rs"