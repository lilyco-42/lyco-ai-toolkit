<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lyco Spine Viewer</title>
<style>
  :root {
    --bg: #16161e;
    --panel: #1e1e2a;
    --panel2: #2a2a3a;
    --line: #3a3a4e;
    --text: #dcdcdc;
    --dim: #8a8aa0;
    --accent: #7aa2f7;
    --ok: #9ece6a;
    --err: #f7768e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 13px/1.5 "Segoe UI", system-ui, sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  header {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 12px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    flex-wrap: wrap;
  }
  header .badge {
    font-size: 11px; color: var(--dim);
    border: 1px solid var(--line); border-radius: 10px;
    padding: 1px 8px;
  }
  main { flex: 1; display: flex; min-height: 0; }
  #sidebar {
    width: 320px; min-width: 260px;
    background: var(--panel);
    border-right: 1px solid var(--line);
    padding: 12px; overflow-y: auto;
    display: flex; flex-direction: column; gap: 14px;
  }
  section { display: flex; flex-direction: column; gap: 6px; }
  section h2 {
    font-size: 11px; text-transform: uppercase; letter-spacing: .08em;
    color: var(--dim); font-weight: 600;
  }
  label { font-size: 12px; color: var(--dim); }
  input[type=text], input[type=number], select {
    background: var(--panel2);
    border: 1px solid var(--line); border-radius: 4px;
    color: var(--text); padding: 6px 8px; font-size: 12px; width: 100%;
  }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  input[type=color] {
    width: 100%; height: 30px; background: var(--panel2);
    border: 1px solid var(--line); border-radius: 4px; padding: 2px;
  }
  button {
    background: var(--panel2);
    border: 1px solid var(--line); border-radius: 4px;
    color: var(--text); padding: 7px 10px; font-size: 12px;
    cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #16161e; font-weight: 600; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  .row { display: flex; gap: 6px; align-items: center; }
  .row > * { flex: 1; }
  .row > button { flex: 0 0 auto; padding: 7px 14px; }
  #canvas-wrap {
    flex: 1; display: flex; align-items: stretch; justify-content: stretch;
    background: repeating-conic-gradient(#20202c 0% 25%, #23232f 0% 50%) 50% / 24px 24px;
    padding: 16px; min-width: 0; min-height: 0;
  }
  #canvas-cell { flex: 1; display: flex; align-items: center; justify-content: center; min-width: 0; min-height: 0; }
  canvas {
    background: transparent;
    border: 1px solid var(--line); border-radius: 4px;
    cursor: grab; touch-action: none;
    max-width: 100%; max-height: 100%;
  }
  canvas.dragging { cursor: grabbing; }
  #status {
    padding: 6px 12px; font-size: 12px;
    border-top: 1px solid var(--line); background: var(--panel);
    color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #status.ok { color: var(--ok); }
  #status.err { color: var(--err); }
  .hint { font-size: 11px; color: var(--dim); }
  kbd {
    background: var(--panel2); border: 1px solid var(--line);
    border-radius: 3px; padding: 0 4px; font-size: 11px;
  }
</style>
</head>
<body>

<header>
  <strong>Lyco Spine Viewer</strong>
  <span class="badge">Spine 3.8 · WebGL 实时预览</span>
  <span class="badge" id="stamp"></span>
</header>

<main>
  <div id="sidebar">
    <section>
      <h2>骨架文件</h2>
      <label>Atlas (.atlas)</label>
      <input type="text" id="atlas" placeholder="D:\assets\spine\op\char_xxx.atlas">
      <label>Skeleton (.skel / .json)</label>
      <input type="text" id="skel" placeholder="同目录的 char_xxx.skel">
      <div class="row">
        <button id="btn-load" class="primary">加载</button>
      </div>
      <div class="hint">把 atlas / skel / png 或整个素材文件夹拖进窗口也行。</div>
    </section>

    <section>
      <h2>骨架信息</h2>
      <div class="hint" id="info">未加载</div>
    </section>

    <section>
      <h2>播放</h2>
      <label>动画</label>
      <select id="anim" disabled></select>
      <label>进度</label>
      <input type="range" id="time" min="0" max="1000" value="0" disabled>
      <div class="row">
        <button id="btn-play" disabled>播放</button>
        <button id="btn-stop" disabled>复位</button>
      </div>
      <label>速度 <span id="speed-val">1.0x</span></label>
      <input type="range" id="speed" min="10" max="200" value="100">
    </section>

    <section>
      <h2>导出（Rust headless 渲染）</h2>
      <label>GIF 帧率 (fps) <span id="fps-val">24</span></label>
      <input type="range" id="fps" min="2" max="60" value="24">
      <div class="row">
        <label>宽 <input type="number" id="width" value="512" min="64" max="2048" step="64"></label>
        <label>高 <input type="number" id="height" value="512" min="64" max="2048" step="64"></label>
      </div>
      <label>背景 <span class="hint">勾选透明则忽略颜色</span></label>
      <div class="row">
        <input type="color" id="bg" value="#000000">
        <label style="flex:0 0 auto; display:flex; align-items:center; gap:4px; white-space:nowrap;">
          <input type="checkbox" id="bgTrans" checked style="width:auto;"> 透明
        </label>
      </div>
      <label>输出目录</label>
      <input type="text" id="outdir" placeholder="留空 = skel 所在目录">
      <div class="row">
        <button id="btn-export-png" disabled>单帧 PNG</button>
        <button id="btn-export-gif" disabled>动画 GIF</button>
      </div>
      <div class="row">
        <button id="btn-export-all" disabled>全部动画 GIF</button>
      </div>
      <div class="hint">导出使用左侧尺寸与背景，与预览视图无关。</div>
    </section>
  </div>

  <div id="canvas-wrap">
    <div id="canvas-cell"><canvas id="canvas"></canvas></div>
  </div>
</main>

<div id="status">就绪</div>

<script>/*__SPINE_RUNTIME__*/</script>
<script>
'use strict';

const BUILD_STAMP = window.__BUILD_STAMP || 'lyco-spine-viewer (dev)';
const $ = (id) => document.getElementById(id);

let nextId = 1;
const pending = new Map();

function post(verb, args) {
  const id = nextId++;
  window.chrome.webview.postMessage([id, verb].concat(args).join('|'));
  return new Promise((resolve) => pending.set(id, resolve));
}

function __reply(id, json) {
  const resolve = pending.get(id);
  if (!resolve) return;
  pending.delete(id);
  resolve(json);
}

function setStatus(text, cls) {
  const el = $('status');
  el.textContent = text;
  el.className = cls || '';
}

function clamp(n, lo, hi) { return Math.max(lo, Math.min(hi, n)); }

function siblingOf(path, ext) {
  const i = Math.max(path.lastIndexOf('\\'), path.lastIndexOf('/'));
  if (i < 0) return path + '.' + ext;
  const dir = path.slice(0, i + 1);
  const name = path.slice(i + 1).replace(/\.[^.]+$/, '');
  return dir + name + '.' + ext;
}

function dirOf(path) {
  const i = Math.max(path.lastIndexOf('\\'), path.lastIndexOf('/'));
  return i < 0 ? '' : path.slice(0, i + 1);
}

function __drop(pair) {
  const field = pair[0];
  const value = pair[1];
  if (field === 'atlas') {
    $('atlas').value = value;
    if (!$('skel').value.trim()) {
      $('skel').value = siblingOf(value, 'skel');
    }
  } else if (field === 'skel') {
    $('skel').value = value;
    if (!$('atlas').value.trim()) {
      $('atlas').value = siblingOf(value, 'atlas');
    }
  } else if (field === 'unknown') {
    const name = value.split(/[\\/]/).pop() || value;
    setStatus(`不认识「${name}」：请拖 .atlas / .skel / .png，或整个素材文件夹`, 'err');
    return;
  } else {
    return;
  }
  const atlas = $('atlas').value.trim();
  const skel = $('skel').value.trim();
  if (atlas && skel) {
    loadSkeleton();
  } else {
    setStatus(`已放置 ${field}：${value}，请再提供另一侧文件`, 'ok');
  }
}

// ---------------------------------------------------------------------------
// WebGL preview: the official spine-ts 3.8 runtime renders every frame on the
// GPU (PRTS-wiki architecture), so playing never touches PNG encoding, IPC,
// or image decode — the per-frame still pipeline that used to flicker is gone.
// ---------------------------------------------------------------------------

let glCtx = null;
let renderer = null;
let skeleton = null;
let state = null;
let trackEntry = null;
let playing = false;
let fitZoom = 1;
let seekHoldUntil = 0;
let anims = [];

function base64ToBytes(b64) {
  const bin = atob(b64);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

function loadImageFromBase64(b64) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => reject(new Error('贴图解码失败'));
    img.src = 'data:image/png;base64,' + b64;
  });
}

function onResize() {
  const canvas = $('canvas');
  const cell = $('canvas-cell');
  if (!cell) return;
  const dpr = window.devicePixelRatio || 1;
  const w = Math.max(64, Math.floor(cell.clientWidth * dpr));
  const h = Math.max(64, Math.floor(cell.clientHeight * dpr));
  if (canvas.width !== w || canvas.height !== h) {
    canvas.width = w;
    canvas.height = h;
  }
  if (renderer) {
    const gl = glCtx.gl;
    gl.viewport(0, 0, canvas.width, canvas.height);
    renderer.camera.setViewport(canvas.width, canvas.height);
    renderer.camera.update();
  }
}

function initWebGL() {
  if (renderer) return true;
  const canvas = $('canvas');
  try {
    glCtx = new spine.webgl.ManagedWebGLRenderingContext(canvas, { alpha: true });
    renderer = new spine.webgl.SceneRenderer(canvas, glCtx);
    onResize();
    new ResizeObserver(onResize).observe($('canvas-cell'));
    window.addEventListener('resize', onResize);
    requestAnimationFrame(loop);
    return true;
  } catch (e) {
    setStatus(`WebGL 初始化失败：${e}`, 'err');
    return false;
  }
}

// Fit the setup pose into the canvas and centre it; wheel zoom and drag pan
// move the camera relative to this fit.
function fitView() {
  if (!skeleton || !renderer) return;
  skeleton.setToSetupPose();
  skeleton.updateWorldTransform();
  const offset = new spine.Vector2();
  const size = new spine.Vector2();
  skeleton.getBounds(offset, size);
  const cam = renderer.camera;
  const canvas = $('canvas');
  if (size.x <= 0 || size.y <= 0) {
    cam.zoom = 1;
    cam.position.set(0, 0, 0);
  } else {
    cam.position.set(offset.x + size.x / 2, offset.y + size.y / 2, 0);
    cam.zoom = Math.max(size.x * 1.12 / canvas.width, size.y * 1.12 / canvas.height);
  }
  fitZoom = cam.zoom;
  cam.update();
  setStatus('视图复位（缩放 100%）');
}

function resetView() {
  fitView();
}

function zoomLabel() {
  if (!renderer || !fitZoom) return '100%';
  return Math.round(fitZoom / renderer.camera.zoom * 100) + '%';
}

let lastFrame = performance.now();

function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, (now - lastFrame) / 1000);
  lastFrame = now;
  if (!renderer || !skeleton || !state) return;
  if (playing) {
    state.update(dt * (parseFloat($('speed').value) || 100) / 100);
    if (trackEntry && now > seekHoldUntil) {
      const dur = animationDuration(selectedAnimation());
      const shown = dur > 0 ? trackEntry.trackTime % dur : trackEntry.trackTime;
      $('time').value = clamp(shown * 1000, 0, parseFloat($('time').max));
    }
  }
  state.apply(skeleton);
  skeleton.updateWorldTransform();
  const gl = glCtx.gl;
  gl.clearColor(0, 0, 0, 0);
  gl.clear(gl.COLOR_BUFFER_BIT);
  renderer.begin();
  renderer.drawSkeleton(skeleton, false);
  renderer.end();
}

function selectedAnimation() {
  const v = $('anim').value;
  return v === '-setup-' ? '-' : v;
}

function animationDuration(name) {
  const a = anims.find((x) => x.name === name);
  return a ? a.seconds : 2.0;
}

function playAnimation(name) {
  if (!state || !skeleton) return;
  if (name === '-') {
    state.clearTracks();
    trackEntry = null;
    skeleton.setToSetupPose();
  } else {
    trackEntry = state.setAnimation(0, name, true);
  }
  $('time').value = 0;
  $('time').max = Math.max(1, animationDuration(name) * 1000);
}

async function loadSkeleton() {
  const atlas = $('atlas').value.trim();
  const skel = $('skel').value.trim();
  if (!atlas || !skel) {
    setStatus('请先填写 atlas 与 skel 路径', 'err');
    return;
  }
  $('btn-load').disabled = true;
  setStatus(`加载 ${skel} …`);
  try {
    const r = await post('load', [atlas, skel]);
    if (!r.ok) {
      setStatus(`加载失败：${r.error}`, 'err');
      return;
    }
    anims = r.animations || [];
    await initWebGLRuntime(atlas, skel, r);
  } finally {
    $('btn-load').disabled = false;
  }
}

async function initWebGLRuntime(atlas, skel, info) {
  const [atlasRes, skelRes] = await Promise.all([
    post('read', [atlas]),
    post('read', [skel]),
  ]);
  if (!atlasRes.ok) { setStatus(`读取 atlas 失败：${atlasRes.error}`, 'err'); return; }
  if (!skelRes.ok) { setStatus(`读取 skeleton 失败：${skelRes.error}`, 'err'); return; }
  const atlasText = new TextDecoder().decode(base64ToBytes(atlasRes.bytes));

  // 3.8 atlas: the first non-empty line names the page texture. Arknights
  // atlases are single-page (531/531 sampled), so one texture serves every
  // region.
  const pngName = (atlasText.split(/\r?\n/).find((l) => l.trim()) || '').trim();
  if (!pngName) { setStatus('atlas 里没有贴图页名字', 'err'); return; }
  const pngRes = await post('read', [dirOf(atlas) + pngName]);
  if (!pngRes.ok) { setStatus(`读取贴图 ${pngName} 失败：${pngRes.error}`, 'err'); return; }

  let img;
  try {
    img = await loadImageFromBase64(pngRes.bytes);
  } catch (e) {
    setStatus(String(e), 'err');
    return;
  }
  if (!initWebGL()) return;

  const texture = new spine.webgl.GLTexture(glCtx, img);
  const spineAtlas = new spine.TextureAtlas(atlasText, () => texture);
  const binary = new spine.SkeletonBinary(new spine.AtlasAttachmentLoader(spineAtlas));
  const data = binary.readSkeletonData(base64ToBytes(skelRes.bytes));
  skeleton = new spine.Skeleton(data);
  state = new spine.AnimationState(new spine.AnimationStateData(data));
  trackEntry = null;

  const sel = $('anim');
  sel.innerHTML = '';
  const setup = document.createElement('option');
  setup.value = '-setup-';
  setup.textContent = '(setup pose)';
  sel.appendChild(setup);
  for (const a of anims) {
    const opt = document.createElement('option');
    opt.value = a.name;
    opt.textContent = `${a.name}  (${a.seconds.toFixed(2)}s)`;
    sel.appendChild(opt);
  }
  sel.disabled = false;
  $('btn-play').disabled = false;
  $('btn-stop').disabled = false;
  $('btn-export-png').disabled = false;
  $('btn-export-gif').disabled = false;
  $('btn-export-all').disabled = false;
  $('time').disabled = false;
  $('info').textContent =
    `版本 ${info.version} · hash ${info.hash}\n` +
    `${info.meshes} mesh / ${info.vertices} 顶点 / ${info.triangles} 三角形\n` +
    `${info.bones} 骨骼 · ${info.slots} 槽 · ${anims.length} 个动画`;

  const preferred = anims.find((a) => /^idle/i.test(a.name));
  sel.value = preferred ? preferred.name : '-setup-';
  playAnimation(selectedAnimation());
  fitView();
  playing = false;
  $('btn-play').textContent = '播放';
  setStatus(`已加载 ${skel}（WebGL 实时预览）`, 'ok');
}

// ---------------------------------------------------------------------------
// Exports stay on the Rust headless renderer: identical pixels every run.
// ---------------------------------------------------------------------------

function bgArgs() {
  if ($('bgTrans').checked) return '0,0,0,0';
  const hex = $('bg').value.replace('#', '');
  const r = parseInt(hex.slice(0, 2), 16);
  const g = parseInt(hex.slice(2, 4), 16);
  const b = parseInt(hex.slice(4, 6), 16);
  return `${r},${g},${b},255`;
}

function exportSize() {
  return [clamp(parseInt($('width').value) || 512, 64, 2048), clamp(parseInt($('height').value) || 512, 64, 2048)];
}

function exportTime() {
  if (!trackEntry) return 0;
  const dur = animationDuration(selectedAnimation());
  return dur > 0 ? trackEntry.trackTime % dur : trackEntry.trackTime;
}

function joinPath(dir, name) {
  if (!dir) return name;
  return dir.replace(/[\\/]+$/, '') + '\\' + name;
}

function safeName(name) {
  return name.replace(/[\\/:*?"<>|]/g, '_');
}

let batchCancel = false;
let exportingAll = false;

async function exportPng() {
  const [w, h] = exportSize();
  const skel = $('skel').value.trim();
  const dir = $('outdir').value.trim();
  const base = skel.split(/[\\/]/).pop() || 'skeleton';
  const baseName = base.replace(/\.(skel|json)$/i, '');
  const anim = selectedAnimation();
  const t = exportTime();
  const out = joinPath(dir, `${baseName}${anim === '-' ? '_setup' : '_' + safeName(anim)}_t${t.toFixed(2)}.png`);
  setStatus(`导出 PNG → ${out} …`);
  const r = await post('export-png', [$('atlas').value.trim(), skel, anim, t.toFixed(3), w, h, bgArgs(), out]);
  if (!r.ok) setStatus(`导出失败：${r.error}`, 'err');
  else setStatus(`已导出 ${r.path}（尺寸 ${w}×${h}）`, 'ok');
}

async function exportGif() {
  const skel = $('skel').value.trim();
  const anim = selectedAnimation();
  if (anim === '-') {
    setStatus('setup pose 没有时长，无法做成 GIF', 'err');
    return;
  }
  const dur = animationDuration(anim);
  const fps = parseFloat($('fps').value) || 24;
  const frames = clamp(Math.round(dur * fps), 4, 600);
  const [w, h] = exportSize();
  const dir = $('outdir').value.trim();
  const base = skel.split(/[\\/]/).pop() || 'skeleton';
  const baseName = base.replace(/\.(skel|json)$/i, '');
  const out = joinPath(dir, `${baseName}_${safeName(anim)}.gif`);
  setStatus(`导出 GIF → ${out}（${frames} 帧 @ ${fps} fps）…`);
  const r = await post('export-gif', [$('atlas').value.trim(), skel, anim, frames, fps, w, h, bgArgs(), out]);
  if (!r.ok) setStatus(`导出失败：${r.error}`, 'err');
  else setStatus(`已导出 ${r.path}（${r.frames} 帧）`, 'ok');
}

async function exportAllGif() {
  if (exportingAll) {
    batchCancel = true;
    return;
  }
  const skel = $('skel').value.trim();
  const list = anims.slice();
  if (!list.length) {
    setStatus('没有动画可导出', 'err');
    return;
  }
  const fps = parseFloat($('fps').value) || 24;
  const [w, h] = exportSize();
  const dir = $('outdir').value.trim();
  const base = skel.split(/[\\/]/).pop() || 'skeleton';
  const baseName = base.replace(/\.(skel|json)$/i, '');
  batchCancel = false;
  exportingAll = true;
  $('btn-export-all').textContent = '取消导出';
  let done = 0;
  let failed = 0;
  try {
    for (const a of list) {
      if (batchCancel) break;
      const frames = clamp(Math.round(a.seconds * fps), 4, 600);
      const out = joinPath(dir, `${baseName}_${safeName(a.name)}.gif`);
      setStatus(`批量导出 ${done + 1}/${list.length}：${a.name}（${frames} 帧 @ ${fps} fps）…`);
      const r = await post('export-gif', [$('atlas').value.trim(), skel, a.name, frames, fps, w, h, bgArgs(), out]);
      if (r.ok) done += 1; else { failed += 1; setStatus(`导出 ${a.name} 失败：${r.error}，继续下一个`, 'err'); }
    }
  } finally {
    exportingAll = false;
    $('btn-export-all').textContent = '全部动画 GIF';
  }
  if (batchCancel) setStatus(`已取消：完成 ${done}/${list.length} 个动画`, 'err');
  else if (failed) setStatus(`完成 ${done}/${list.length}，失败 ${failed} 个`, 'err');
  else setStatus(`已导出全部 ${done} 个动画 GIF → ${dir || 'skel 所在目录'}`, 'ok');
}

// ---------------------------------------------------------------------------
// Wiring
// ---------------------------------------------------------------------------

$('btn-load').addEventListener('click', loadSkeleton);
$('atlas').addEventListener('keydown', (e) => { if (e.key === 'Enter') loadSkeleton(); });
$('skel').addEventListener('keydown', (e) => { if (e.key === 'Enter') loadSkeleton(); });

$('anim').addEventListener('change', () => {
  playAnimation(selectedAnimation());
});

$('time').addEventListener('input', () => {
  if (!trackEntry) return;
  seekHoldUntil = performance.now() + 400;
  trackEntry.trackTime = parseFloat($('time').value) / 1000;
});

$('btn-play').addEventListener('click', () => {
  if (!skeleton) return;
  if (selectedAnimation() === '-') {
    setStatus('setup pose 是静止姿势，选一个动画再播放', 'err');
    return;
  }
  playing = !playing;
  $('btn-play').textContent = playing ? '暂停' : '播放';
});
$('btn-stop').addEventListener('click', () => {
  playing = false;
  $('btn-play').textContent = '播放';
  playAnimation(selectedAnimation());
});
$('speed').addEventListener('input', () => {
  $('speed-val').textContent = (parseFloat($('speed').value) / 100).toFixed(1) + 'x';
});

$('fps').addEventListener('input', () => { $('fps-val').textContent = $('fps').value; });
$('btn-export-png').addEventListener('click', exportPng);
$('btn-export-gif').addEventListener('click', exportGif);
$('btn-export-all').addEventListener('click', exportAllGif);

// View interaction on the WebGL canvas: wheel zooms around the cursor
// (camera.zoom is world units per pixel), drag pans the camera, double-click
// refits the pose.
(() => {
  const c = $('canvas');
  c.addEventListener('wheel', (e) => {
    e.preventDefault();
    if (!renderer) return;
    const cam = renderer.camera;
    const factor = e.deltaY < 0 ? 1 / 1.12 : 1.12;
    const next = clamp(cam.zoom * factor, fitZoom / 40, fitZoom * 20);
    if (next === cam.zoom) return;
    const rect = c.getBoundingClientRect();
    const sx = ((e.clientX - rect.left) / rect.width) * c.width;
    const sy = ((e.clientY - rect.top) / rect.height) * c.height;
    const before = cam.screenToWorld(new spine.webgl.Vector3(sx, sy, 0), c.width, c.height);
    cam.zoom = next;
    cam.update();
    const after = cam.screenToWorld(new spine.webgl.Vector3(sx, sy, 0), c.width, c.height);
    cam.position.x += before.x - after.x;
    cam.position.y += before.y - after.y;
    cam.update();
    setStatus(`缩放 ${zoomLabel()}`);
  }, { passive: false });

  let dragging = false;
  let lastX = 0;
  let lastY = 0;
  c.addEventListener('mousedown', (e) => {
    if (e.button !== 0 || !renderer) return;
    dragging = true;
    lastX = e.clientX;
    lastY = e.clientY;
    c.classList.add('dragging');
  });
  window.addEventListener('mousemove', (e) => {
    if (!dragging || !renderer) return;
    const cam = renderer.camera;
    const rect = c.getBoundingClientRect();
    const dx = ((e.clientX - lastX) / rect.width) * c.width;
    const dy = ((e.clientY - lastY) / rect.height) * c.height;
    lastX = e.clientX;
    lastY = e.clientY;
    cam.position.x -= dx * cam.zoom;
    cam.position.y += dy * cam.zoom;
    cam.update();
  });
  window.addEventListener('mouseup', () => {
    if (!dragging) return;
    dragging = false;
    c.classList.remove('dragging');
  });
  c.addEventListener('dblclick', () => {
    if (!renderer) return;
    resetView();
  });
})();

onResize();
$('stamp').textContent = BUILD_STAMP;
</script>
</body>
</html>
