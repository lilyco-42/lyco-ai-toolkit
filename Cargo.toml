[workspace]
resolver = "2"
members = [
    "crates/lyco-cli",
    "crates/lyco-mc-skin",
    "crates/lyco-bsm",
    "crates/lyco-bundle",
    "crates/lyco-lyrics",
    "crates/lyco-codegen-mcp",
]

[workspace.package]
version = "0.1.0-dev"
edition = "2021"
license = "MIT"

[workspace.dependencies]
clap = "4"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = "0.25"
imagequant = "4.1"
tracing = "0.1"
tracing-subscriber = "0.3"
