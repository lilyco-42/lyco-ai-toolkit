[workspace]
resolver = "2"
members = [
    "crates/lyco-cli",
    "crates/lyco-mc-skin",
    "crates/lyco-audio",
    "crates/lyco-image",
    "crates/lyco-bsm",
    "crates/lyco-bundle",
    "crates/lyco-lyrics",
    "crates/lyco-codegen-mcp",
]

[workspace.package]
version = "0.1.0-dev"
edition = "2021"
license = "MIT"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }