name: Spine render client release

# Builds the lyco-spine-render CLI (local rendering + hosted --remote
# mode) for Windows and Linux. A pushed v* tag publishes both binaries
# as a GitHub Release; a manual dispatch only validates the builds and
# uploads run artifacts. The local build channel stays authoritative
# nowhere: this repo compiles only in CI (the production box cannot).
#
# Licence note: the binary links the official Spine runtime via
# rusty_spine; the repository owner accepted distribution
# responsibility on 2026-10-20 (same note in spine-render-linux.yml).

on:
  workflow_dispatch:
  push:
    # 'v*' belongs to the spine-viewer release line; this one keeps its
    # own prefix so a tag never fires both workflows at once.
    tags: ["spine-render-v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build lyco-spine-render (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            binary: lyco-spine-render.exe
            artifact: lyco-spine-render-windows-x64
          - os: ubuntu-latest
            binary: lyco-spine-render
            artifact: lyco-spine-render-linux-x64
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: true
          cache-on-failure: true
          key: spine-render-client-${{ matrix.os }}

      - name: Build
        run: cargo build --release -p lyco-spine-render

      - name: Smoke test the binary
        shell: bash
        run: |
          ./target/release/${{ matrix.binary }} 2>&1 | head -30 || true
          ./target/release/${{ matrix.binary }} describe 2>&1 | head -3 || true

      - name: Upload the binary (run artifact)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: target/release/${{ matrix.binary }}
          if-no-files-found: error

      - name: Publish to a GitHub Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          gh release create "$tag" --title "$tag" --generate-notes \
            target/release/${{ matrix.binary }} \
            --clobber || \
          gh release upload "$tag" target/release/${{ matrix.binary }} --clobber
        env:
          GH_TOKEN: ${{ github.token }}