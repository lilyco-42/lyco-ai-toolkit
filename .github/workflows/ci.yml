name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      # Order matters: correctness gates run before the formatting gate so a
      # cosmetic diff can never hide a failing test.
      - name: test
        run: cargo test --workspace --all-targets
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: build
        run: cargo build --workspace

      - name: cli surface smoke test
        run: |
          set -euo pipefail
          ./target/debug/lyco-cli --version
          ./target/debug/lyco-cli --help
          # Scaffolded subcommands must fail fast until implemented, so a
          # green pipeline can never imply that assets were produced.
          if ./target/debug/lyco-cli bundle --prompt x; then
            echo 'scaffold subcommands must fail fast until implemented'
            exit 1
          fi

      - name: fmt
        run: cargo fmt --all -- --check
