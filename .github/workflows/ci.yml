name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      # Order matters: correctness gates run before the formatting gate so a
      # cosmetic diff can never hide a failing test.
      - name: test
        run: cargo test --workspace --all-targets
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: build
        run: cargo build --workspace

      - name: cli must fail fast on unimplemented subcommands
        run: |
          set -euo pipefail
          ./target/debug/lyco-cli --version
          ./target/debug/lyco-cli --help
          if ./target/debug/lyco-cli bundle --prompt x; then
            echo 'scaffold subcommands must fail fast until implemented'
            exit 1
          fi

      # Proves F1 end to end through the real binary, not just unit tests.
      - name: skin roundtrip smoke test
        run: |
          set -euo pipefail
          d="$(mktemp -d)"

          ./target/debug/lyco-cli skin template --out "$d/skin.png"
          ./target/debug/lyco-cli skin validate "$d/skin.png"
          ./target/debug/lyco-cli skin info "$d/skin.png"

          # classic template must be detected as classic
          ./target/debug/lyco-cli skin info "$d/skin.png" > "$d/info.txt"
          grep -q 'classic' "$d/info.txt"

          # slim template must be detected as slim
          ./target/debug/lyco-cli skin template --out "$d/slim.png" --arm slim
          ./target/debug/lyco-cli skin info "$d/slim.png" > "$d/slim-info.txt"
          grep -q 'slim' "$d/slim-info.txt"

          # quantization must shrink the palette and stay structurally valid
          ./target/debug/lyco-cli skin quantize "$d/skin.png" --out "$d/q.png" --colors 6
          ./target/debug/lyco-cli skin validate --json "$d/q.png"

          # garbage input must be rejected with a non-zero exit
          head -c 256 /dev/urandom > "$d/bad.png"
          if ./target/debug/lyco-cli skin validate "$d/bad.png" 2>/dev/null; then
            echo 'an unreadable skin must exit non-zero'
            exit 1
          fi

      # Proves F2/F3 end to end through the real binary.
      - name: model roundtrip smoke test
        run: |
          set -euo pipefail
          d="$(mktemp -d)"

          ./target/debug/lyco-cli bsm humanoid --out "$d/model.geo.json"
          ./target/debug/lyco-cli bsm validate "$d/model.geo.json"
          ./target/debug/lyco-cli bsm info "$d/model.geo.json"
          ./target/debug/lyco-cli bsm validate --json "$d/model.geo.json"

          # the slim variant must be valid too
          ./target/debug/lyco-cli bsm humanoid --out "$d/slim.geo.json" --arm slim
          ./target/debug/lyco-cli bsm validate "$d/slim.geo.json"
          grep -q 'geometry.lyco_player' "$d/slim.geo.json"
          grep -q '"right_arm"' "$d/slim.geo.json"

          # an empty geometry list must be rejected with a non-zero exit
          printf '%s' '{"format_version":"1.12.0","minecraft:geometry":[]}' > "$d/bad.geo.json"
          if ./target/debug/lyco-cli bsm validate "$d/bad.geo.json" 2>/dev/null; then
            echo 'an empty geometry file must exit non-zero'
            exit 1
          fi

          # build a minimal GLB and inspect it through the CLI
          python3 scripts/make-test-glb.py "$d/model.glb"
          ./target/debug/lyco-cli bsm glb-info "$d/model.glb" | tee "$d/glb.txt"
          grep -q '3 vertices, 1 triangles' "$d/glb.txt"


      # Proves F6 end to end, and cross-checks our WAV writer against an
      # independent decoder (Python's stdlib wave module).
      - name: bgm roundtrip smoke test
        run: |
          set -euo pipefail
          d="$(mktemp -d)"

          # --backend stub is the only backend usable without a GPU
          ./target/debug/lyco-cli bgm --prompt 'calm evening' --duration 2 --out "$d/bgm.wav"
          ./target/debug/lyco-cli bgm --prompt 'calm evening' --duration 2 --out "$d/again.wav"
          cmp "$d/bgm.wav" "$d/again.wav"

          [ "$(head -c 4 "$d/bgm.wav")" = "RIFF" ]

          python3 -c "import sys,wave; w=wave.open(sys.argv[1]); print(w.getnframes()/w.getframerate(), w.getnchannels(), w.getsampwidth())" "$d/bgm.wav" | tee "$d/probe.txt"
          grep -q '2.0 2 2' "$d/probe.txt"

          # a backend that cannot be started must fail, not pass quietly
          if ./target/debug/lyco-cli bgm --prompt x --duration 1 --out "$d/x.wav" --backend definitely-not-a-real-binary-xyz 2>/dev/null; then
            echo 'a missing backend binary must exit non-zero'
            exit 1
          fi


      - name: fmt
        run: cargo fmt --all -- --check