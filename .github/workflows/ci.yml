name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      # The Spine renderer's runtime is a git dependency, so a cold run clones
      # it, and that clone is most of the wait.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/git/db
            ~/.cargo/git/checkouts
          key: spine-git-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            spine-git-${{ runner.os }}-
      # A new crate has to be declared in the Cargo.toml of whoever uses it.
      # That has been forgotten twice, once per crate, and the compiler only
      # says so after a full round trip; this says it in a second.
      - name: declared dependencies cover the imports
        run: |
          python3 - <<'PY'
          import pathlib, re, sys

          problems = []
          for cargo in sorted(pathlib.Path("crates").glob("*/Cargo.toml")):
              crate = cargo.parent
              declared = {
                  name.replace("-", "_")
                  for name in re.findall(
                      r"^(lyco-[a-z0-9-]+)\s*=", cargo.read_text(), re.M
                  )
              }
              used = set()
              for rs in crate.rglob("*.rs"):
                  used |= set(re.findall(r"^\s*use\s+(lyco_[a-z0-9_]+)", rs.read_text(), re.M))
              # A crate's own name shows up in its binary's imports. That is
              # not a missing dependency, and saying so is a false alarm.
              own = crate.name.replace("-", "_")
              missing = used - declared - {own}
              if missing:
                  problems.append(f"{crate.name}: uses {sorted(missing)} but declares {sorted(declared)}")

          if problems:
              print("\n".join(problems))
              sys.exit(1)
          print("every lyco crate a source file uses is declared")
          PY

      # Order matters: correctness gates run before the formatting gate so a
      # cosmetic diff can never hide a failing test.
      - name: test
        run: cargo test --workspace --all-targets
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: build
        run: cargo build --workspace

      - name: cli surface smoke test
        run: |
          set -euo pipefail
          ./target/debug/lyco-cli --version
          ./target/debug/lyco-cli --help
          # An unknown subcommand must fail, so the smoke test can never pass
          # by accident on a CLI that silently ignores its arguments.
          if ./target/debug/lyco-cli definitely-not-a-command 2>/dev/null; then
            echo 'an unknown subcommand must exit non-zero'
            exit 1
          fi

      # Proves F1 end to end through the real binary, not just unit tests.
      - name: skin roundtrip smoke test
        run: |
          set -euo pipefail
          d="$(mktemp -d)"

          ./target/debug/lyco-cli skin template --out "$d/skin.png"
          ./target/debug/lyco-cli skin validate "$d/skin.png"
          ./target/debug/lyco-cli skin info "$d/skin.png"

          # classic template must be detected as classic
          ./target/debug/lyco-cli skin info "$d/skin.png" > "$d/info.txt"
          grep -q 'classic' "$d/info.txt"

          # slim template must be detected as slim
          ./target/debug/lyco-cli skin template --out "$d/slim.png" --arm slim
          ./target/debug/lyco-cli skin info "$d/slim.png" > "$d/slim-info.txt"
          grep -q 'slim' "$d/slim-info.txt"

          # quantization must shrink the palette and stay structurally valid
          ./target/debug/lyco-cli skin quantize "$d/skin.png" --out "$d/q.png" --colors 6
          ./target/debug/lyco-cli skin validate --json "$d/q.png"

          # Overlay repair. A solid-white skin has every overlay rectangle
          # filled, which is what a model returns when it learned that
          # backgrounds are white. 64*64 = 4096 pixels and the six overlay
          # rectangles cover 1920 of them, so 2176 must survive.
          python3 scripts/make-solid-skin.py "$d/white.png"
          ./target/debug/lyco-cli skin info "$d/white.png" > "$d/white-info.txt"
          grep -q 'opaque pixels  : 4096' "$d/white-info.txt"

          ./target/debug/lyco-cli skin fix-overlay "$d/white.png" --out "$d/fixed.png"
          ./target/debug/lyco-cli skin info "$d/fixed.png" > "$d/fixed-info.txt"
          grep -q 'opaque pixels  : 2176' "$d/fixed-info.txt"
          ./target/debug/lyco-cli skin validate "$d/fixed.png"

          # a genuine dark overlay must be left untouched
          python3 scripts/make-solid-skin.py "$d/dark.png" 30 40 90
          ./target/debug/lyco-cli skin fix-overlay "$d/dark.png" --out "$d/dark-fixed.png" > "$d/dark.txt"
          grep -q 'total cleared: 0 px' "$d/dark.txt"

          # garbage input must be rejected with a non-zero exit
          head -c 256 /dev/urandom > "$d/bad.png"
          if ./target/debug/lyco-cli skin validate "$d/bad.png" 2>/dev/null; then
            echo 'an unreadable skin must exit non-zero'
            exit 1
          fi

      # Proves F2/F3 end to end through the real binary.
      - name: model roundtrip smoke test
        run: |
          set -euo pipefail
          d="$(mktemp -d)"

          ./target/debug/lyco-cli bsm humanoid --out "$d/model.geo.json"
          ./target/debug/lyco-cli bsm validate "$d/model.geo.json"
          ./target/debug/lyco-cli bsm info "$d/model.geo.json"
          ./target/debug/lyco-cli bsm validate --json "$d/model.geo.json"

          # the slim variant must be valid too
          ./target/debug/lyco-cli bsm humanoid --out "$d/slim.geo.json" --arm slim
          ./target/debug/lyco-cli bsm validate "$d/slim.geo.json"
          grep -q 'geometry.lyco_player' "$d/slim.geo.json"
          grep -q '"right_arm"' "$d/slim.geo.json"

          # an empty geometry list must be rejected with a non-zero exit
          printf '%s' '{"format_version":"1.12.0","minecraft:geometry":[]}' > "$d/bad.geo.json"
          if ./target/debug/lyco-cli bsm validate "$d/bad.geo.json" 2>/dev/null; then
            echo 'an empty geometry file must exit non-zero'
            exit 1
          fi

          # build a minimal GLB and inspect it through the CLI
          python3 scripts/make-test-glb.py "$d/model.glb"
          ./target/debug/lyco-cli bsm glb-info "$d/model.glb" | tee "$d/glb.txt"
          grep -q '3 vertices, 1 triangles' "$d/glb.txt"

          # F3: convert that GLB into Bedrock geometry plus a texture
          ./target/debug/lyco-cli bsm from-glb "$d/model.glb" \
            --out "$d/converted.geo.json" --texture "$d/converted.png" --resolution 16
          ./target/debug/lyco-cli bsm validate "$d/converted.geo.json"
          python3 -c "import struct,sys; d=open(sys.argv[1],'rb').read(24); print(*struct.unpack('>II', d[16:24]))" "$d/converted.png" | tee "$d/tex.txt"
          grep -qE '^[0-9]+ [0-9]+$' "$d/tex.txt"


      # Proves F6 end to end, and cross-checks our WAV writer against an
      # independent decoder (Python's stdlib wave module).
      - name: bgm roundtrip smoke test
        run: |
          set -euo pipefail
          d="$(mktemp -d)"

          # --backend stub is the only backend usable without a GPU
          ./target/debug/lyco-cli bgm --prompt 'calm evening' --duration 2 --out "$d/bgm.wav"
          ./target/debug/lyco-cli bgm --prompt 'calm evening' --duration 2 --out "$d/again.wav"
          cmp "$d/bgm.wav" "$d/again.wav"

          [ "$(head -c 4 "$d/bgm.wav")" = "RIFF" ]

          python3 -c "import sys,wave; w=wave.open(sys.argv[1]); print(w.getnframes()/w.getframerate(), w.getnchannels(), w.getsampwidth())" "$d/bgm.wav" | tee "$d/probe.txt"
          grep -q '2.0 2 2' "$d/probe.txt"

          # a backend that cannot be started must fail, not pass quietly
          if ./target/debug/lyco-cli bgm --prompt x --duration 1 --out "$d/x.wav" --backend definitely-not-a-real-binary-xyz 2>/dev/null; then
            echo 'a missing backend binary must exit non-zero'
            exit 1
          fi


      # The S5 acceptance criterion: one command, four artifacts.
      - name: bundle smoke test (S5 acceptance)
        run: |
          set -euo pipefail
          d="$(mktemp -d)"

          ./target/debug/lyco-cli bundle --prompt 'a quiet librarian' --out "$d/bundle" --bgm-duration 2

          for f in skin.png model.geo.json bgm.wav portrait.png lyrics.txt manifest.json; do
            test -s "$d/bundle/$f" || { echo "missing or empty: $f"; exit 1; }
          done

          # our own validators must accept what we emitted
          ./target/debug/lyco-cli skin validate "$d/bundle/skin.png"
          ./target/debug/lyco-cli bsm validate "$d/bundle/model.geo.json"

          # the manifest must state which artifacts are placeholders
          python3 -c "import json,sys; m=json.load(open(sys.argv[1])); print(sorted((a['kind'], a['placeholder']) for a in m['artifacts']))" "$d/bundle/manifest.json" | tee "$d/labels.txt"
          grep -q "('model', False)" "$d/labels.txt"
          grep -q "('portrait', True)" "$d/labels.txt"
          grep -q "('lyrics', True)" "$d/labels.txt"

          # independent checks straight off the file headers
          png_size() { python3 -c "import struct,sys; d=open(sys.argv[1],'rb').read(24); print(*struct.unpack('>II', d[16:24]))" "$1"; }
          test "$(png_size "$d/bundle/skin.png")" = "64 64"
          test "$(png_size "$d/bundle/portrait.png")" = "512 512"
          python3 -c "import sys,wave; w=wave.open(sys.argv[1]); print(w.getnframes()/w.getframerate(), w.getnchannels())" "$d/bundle/bgm.wav" | grep -q '2.0 2'


      # Proves F8 end to end, including that prose-with-no-markers fails.
      - name: lyrics smoke test
        run: |
          set -euo pipefail
          d="$(mktemp -d)"

          ./target/debug/lyco-cli lyrics --prompt 'a quiet librarian' --out "$d/lyrics.txt"
          grep -q '^\[Verse 1\]$' "$d/lyrics.txt"
          grep -q '^\[Chorus\]$' "$d/lyrics.txt"
          grep -q '^\[Bridge\]$' "$d/lyrics.txt"

          # a writer that exits 0 but produces no file must be rejected
          if ./target/debug/lyco-cli lyrics --prompt x --out "$d/missing.txt" --backend 'sh -c true' 2>/dev/null; then
            echo 'a writer producing nothing must exit non-zero'
            exit 1
          fi


      # Proves F9 with a real MCP session over stdin/stdout.
      - name: mcp stdio smoke test
        run: |
          set -euo pipefail
          d="$(mktemp -d)"
          cat > "$d/req.jsonl" <<EOF
          {"jsonrpc":"2.0","id":1,"method":"initialize"}
          {"jsonrpc":"2.0","method":"notifications/initialized"}
          {"jsonrpc":"2.0","id":2,"method":"tools/list"}
          {"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"skin_template","arguments":{"out":"$d/skin.png"}}}
          {"jsonrpc":"2.0","id":4,"method":"tools/call","params":{"name":"nope"}}
          EOF

          ./target/debug/lyco-cli mcp < "$d/req.jsonl" > "$d/resp.jsonl"

          # one reply per request; the notification must produce none
          test "$(wc -l < "$d/resp.jsonl")" -eq 4
          grep -q '"protocolVersion"' "$d/resp.jsonl"
          grep -q '"skin_template"' "$d/resp.jsonl"
          grep -q '"isError":false' "$d/resp.jsonl"
          grep -q '"code":-32602' "$d/resp.jsonl"

          # the tool really produced its artifact
          test -s "$d/skin.png"
          ./target/debug/lyco-cli skin validate "$d/skin.png"


      # Kaggle kernel render. Uploads nothing, so it runs in CI: it proves
      # the generated notebook is real nbformat, that the metadata names
      # the notebook sitting beside it, and that the atlas layout has not
      # been copied into the notebook.
      - name: kaggle kernel render smoke test
        run: |
          set -euo pipefail
          rm -rf out/kernel
          d=out/kernel
          ./target/debug/lyco-cli kaggle render \
            --owner lilyco4242 --slug lyco-skin-gen --seeds 7,42 --out "$d"
          test -f "$d/lyco-skin-gen.ipynb"
          test -f "$d/kernel-metadata.json"

          python3 - "$d" <<'PY'
          import json, os, sys

          d = sys.argv[1]
          nb = json.load(open(os.path.join(d, "lyco-skin-gen.ipynb")))
          assert nb["nbformat"] == 4, nb["nbformat"]
          assert len(nb["cells"]) >= 5, len(nb["cells"])

          meta = json.load(open(os.path.join(d, "kernel-metadata.json")))
          assert meta["code_file"] == "lyco-skin-gen.ipynb"
          assert meta["enable_gpu"] is True
          assert meta["enable_internet"] is True, "weights come from Hugging Face"

          src = "".join("".join(c["source"]) for c in nb["cells"])
          assert "GUIDANCE = 4" in src, "the guidance scale must survive"
          assert "resize((512, 512))" in src, "the resize must survive"
          assert "raise RuntimeError" in src, "a blank run must fail loudly"
          assert "OVERLAY_RECTS" not in src, "the UV table must not be duplicated"
          assert "fix_white_overlay" not in src, "repair belongs to lyco-mc-skin"
          print("kernel render verified")
          PY

      # Hand the rendered kernel to whoever will push it. The notebook is
      # generated by Rust, so this is the artefact itself, not a hand copy.
      - name: upload the rendered kernel
        uses: actions/upload-artifact@v4
        with:
          name: lyco-skin-kernel
          path: out/kernel/
          if-no-files-found: error

      # The real thing. tests/fixtures/blockv06_seed7.png is what BLOCKv0.6
      # actually returned from a Kaggle T4: RGB with no alpha, so the model's
      # white background sits in every overlay rectangle. Repair must clear
      # that and leave the character alone.
      - name: overlay repair on real generated skins
        run: |
          set -euo pipefail
          rm -rf out/fixtures && mkdir -p out/fixtures

          ./target/debug/lyco-cli skin info tests/fixtures/blockv06_seed7.png > out/fixtures/before.txt
          grep -q 'opaque pixels  : 4096' out/fixtures/before.txt

          for seed in 7 42; do
            src="tests/fixtures/blockv06_seed$seed.png"
            ./target/debug/lyco-cli skin fix-overlay "$src" \
              --out "out/fixtures/seed${seed}_fixed.png" > "out/fixtures/seed${seed}_repair.txt"

            # The overlay is 1920 of the atlas's 4096 pixels, so clearing most of
            # it is the whole point, and clearing more than it would be a bug.
            # The exact figure varies by seed: the keep-percent rule can decide
            # that a thin garment is background and clear a rectangle outright.
            cleared=$(sed -n 's/^total cleared: \([0-9]*\) px$/\1/p' "out/fixtures/seed${seed}_repair.txt")
            test -n "$cleared"
            test "$cleared" -ge 1400
            test "$cleared" -le 1920

            ./target/debug/lyco-cli skin info "out/fixtures/seed${seed}_fixed.png" > "out/fixtures/seed${seed}_after.txt"
            after=$(sed -n 's/^opaque pixels *: *\([0-9]*\)$/\1/p' "out/fixtures/seed${seed}_after.txt")
            test "$after" -eq $((4096 - cleared))
            # The character itself must still be there.
            test "$after" -ge 2000

            ./target/debug/lyco-cli skin validate "out/fixtures/seed${seed}_fixed.png"
            ./target/debug/lyco-cli skin preview "out/fixtures/seed${seed}_fixed.png" \
              --out "out/fixtures/seed${seed}_front.png" --scale 8
            ./target/debug/lyco-cli skin preview "$src" \
              --out "out/fixtures/seed${seed}_raw_front.png" --scale 8
            echo "seed $seed: cleared $cleared, $after opaque remain"
          done

      - name: upload the repaired previews
        uses: actions/upload-artifact@v4
        with:
          name: lyco-repaired-skins
          path: out/fixtures/
          if-no-files-found: error

      # Atlas repair, on the shape of file the real dumps ship: a page whose
      # `size` field is missing, sitting next to a PNG that knows the truth.
      - name: spine atlas repair smoke test
        run: |
          set -euo pipefail
          d="$(mktemp -d)"
          cp tests/fixtures/blockv06_seed7.png "$d/atlas.png"
          cat > "$d/model.atlas" <<'EOF'
          atlas.png
          format: RGBA8888
          filter: Linear,Linear
          repeat: none
          head
            rotate: false
            xy: 2, 2
            size: 8, 8
          EOF

          ./target/debug/lyco-cli spine info "$d/model.atlas" > "$d/before.txt"
          grep -q 'declares size: false' "$d/before.txt"
          grep -q 'regions: 1' "$d/before.txt"
          grep -q 'pages:   1' "$d/before.txt"

          ./target/debug/lyco-cli spine normalize "$d/model.atlas" --dir "$d" > "$d/fixed.atlas"
          grep -q '^size: 64,64$' "$d/fixed.atlas"
          head -1 "$d/fixed.atlas" | grep -q '^atlas.png$'

          # Repair is idempotent: a second pass must byte-for-byte agree.
          ./target/debug/lyco-cli spine normalize "$d/fixed.atlas" --dir "$d" > "$d/twice.atlas"
          cmp "$d/fixed.atlas" "$d/twice.atlas"

          ./target/debug/lyco-cli spine normalize "$d/model.atlas" --dir "$d" --pma > "$d/pma.atlas"
          grep -q '^pma: true$' "$d/pma.atlas"

          ./target/debug/lyco-cli spine info "$d/pma.atlas" > "$d/after.txt"
          grep -q 'declares size: true' "$d/after.txt"
          grep -q 'declares pma : true' "$d/after.txt"

          # Only an explicit 3.8 conversion strips modern page fields.
          ./target/debug/lyco-cli spine normalize "$d/pma.atlas" --dir "$d" --strip-3-8 > "$d/legacy.atlas"
          if grep -q '^pma:' "$d/legacy.atlas"; then
            echo 'explicit Spine 3.8 conversion retained an unsupported field'
            exit 1
          fi
          grep -q '^size: 64,64$' "$d/legacy.atlas"
          ./target/debug/lyco-cli spine info "$d/legacy.atlas" | grep -q 'regions: 1'

          # A page whose PNG is absent must be reported, not invented.
          ./target/debug/lyco-cli spine normalize "$d/model.atlas" --dir "$d/nothing" \
            > "$d/orphan.atlas" 2> "$d/orphan.err"
          if grep -q '^size:' "$d/orphan.atlas"; then
            echo 'a size was invented for a page with no PNG'
            exit 1
          fi
          grep -q 'size is unknown, so it was left alone' "$d/orphan.err"

      # A real export must name its Spine version, because the version decides
      # which runtimes can open it at all. These are the first 35 bytes of a
      # real Arknights .skel: a hash, then 3.8.99.
      - name: spine skeleton version smoke test
        run: |
          set -euo pipefail
          d="$(mktemp -d)"
          python3 - "$d/real.skel" <<'PY'
          import sys

          def s(text):
              b = text.encode()
              # The length byte counts a terminator that is not written.
              return bytes([len(b) + 1]) + b

          data = s("3zUmVpPXAB+DFpqv9VEzMu6Co8M") + s("3.8.99") + bytes([0xC2, 0xFA, 0xCD])
          open(sys.argv[1], "wb").write(data)
          PY

          ./target/debug/lyco-cli spine version "$d/real.skel" > "$d/v.txt"
          grep -q 'version: 3.8.99' "$d/v.txt"
          grep -q 'family:  spine 3.x' "$d/v.txt"
          grep -q '3zUmVpPXAB' "$d/v.txt"

          # A 4.3 export has no hash and is a different family.
          python3 - "$d/v43.skel" <<'PY'
          import sys

          b = b"4.3.00"
          open(sys.argv[1], "wb").write(bytes([len(b) + 1]) + b)
          PY
          ./target/debug/lyco-cli spine version "$d/v43.skel" > "$d/v43.txt"
          grep -q 'version: 4.3.00' "$d/v43.txt"
          grep -q 'family:  spine 4.x' "$d/v43.txt"

      # The bundle has to carry a repaired atlas through, and must not invent a
      # size when the page image is absent.
      - name: bundle spine repair smoke test
        run: |
          set -euo pipefail
          d="$(mktemp -d)"
          mkdir -p "$d/src"
          cp tests/fixtures/blockv06_seed7.png "$d/src/page.png"
          printf 'page.png\nformat: RGBA8888\nhead\n  xy: 2, 2\n' > "$d/src/char.atlas"

          ./target/debug/lyco-cli bundle --prompt 'amiya' --out "$d/out" --spine "$d/src/char.atlas"
          grep -q '^size: 64,64$' "$d/out/char.atlas"
          grep -q '^format: RGBA8888$' "$d/out/char.atlas"

          python3 - "$d/out/manifest.json" <<'PY'
          import json, sys

          m = json.load(open(sys.argv[1]))
          kinds = [a["kind"] for a in m["artifacts"]]
          assert "spine_atlas" in kinds, kinds
          a = next(a for a in m["artifacts"] if a["kind"] == "spine_atlas")
          assert a["backend"] == "lyco-spine", a
          assert a["placeholder"] is False, "a repair is real work"
          print("bundle spine artifact ok")
          PY

          # An orphan page must be reported, never given a size it cannot know.
          mkdir -p "$d/orphan"
          printf 'gone.png\nformat: RGBA8888\nhead\n  xy: 0,0\n' > "$d/orphan/o.atlas"
          ./target/debug/lyco-cli bundle --prompt x --out "$d/orphan-out" --spine "$d/orphan/o.atlas" 2>&1 | tee "$d/orphan.log"
          if grep -q '^size:' "$d/orphan-out/o.atlas"; then
            echo 'a size was invented for an atlas with no page image'
            exit 1
          fi
          grep -q 'not found' "$d/orphan.log"

      # OBJ in, Bedrock geometry out. The fixture is deliberately the shape a
      # real UnityPy export has: `f v/vt/vn` corners and no `vn` lines at all,
      # which an earlier reader mistook for real normals.
      - name: obj conversion smoke test
        run: |
          set -euo pipefail
          d="$(mktemp -d)"
          cat > "$d/model.obj" <<'EOF'
          g block
          v 0 0 0
          v 4 0 0
          v 4 4 0
          v 0 4 0
          v 0 0 4
          v 4 0 4
          v 4 4 4
          v 0 4 4
          vt 0 0
          vt 1 0
          vt 0 1
          f 1/1/1 2/1/1 3/1/1
          f 1/1/1 3/1/1 4/1/1
          f 5/2/1 6/2/1 7/2/1
          f 5/2/1 7/2/1 8/2/1
          EOF

          ./target/debug/lyco-cli bsm obj-info "$d/model.obj" > "$d/info.txt"
          grep -q 'vertices:  8' "$d/info.txt"
          grep -q 'triangles: 4' "$d/info.txt"
          grep -q 'groups:    1' "$d/info.txt"
          grep -q 'normals:   false' "$d/info.txt"
          grep -q 'uvs:       true' "$d/info.txt"

          ./target/debug/lyco-cli bsm from-obj "$d/model.obj" \
            --out "$d/model.geo.json" --texture "$d/model.png"
          ./target/debug/lyco-cli bsm validate "$d/model.geo.json"
          test -s "$d/model.png"

          # A file with no faces is not a mesh and must be refused.
          printf 'v 0 0 0\nv 1 0 0\n' > "$d/empty.obj"
          if ./target/debug/lyco-cli bsm obj-info "$d/empty.obj" 2>/dev/null; then
            echo 'a file with no faces must be refused'
            exit 1
          fi

      - name: fmt
        run: cargo fmt --all -- --check

  # A Windows executable has to be built on Windows, and the operator's machine
  # may not compile at all. Handing over the binary is the entire point of this
  # job: everything the local machine needs to do is run it.
  windows-binary:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # The Spine renderer's runtime is a git dependency, so a cold run clones
      # it, and that clone is most of the wait.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/git/db
            ~/.cargo/git/checkouts
          key: spine-git-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            spine-git-${{ runner.os }}-
      - name: build the CLI
        run: cargo build --release -p lyco-cli

      # The Spine renderer links the official runtime, so it is NOT handed out
      # here: whoever ships a binary built from it needs a Spine licence. This
      # step only proves it still compiles. To actually get the binary, run
      # the `build from source` workflow yourself.
      - name: prove the Spine renderer still compiles
        run: cargo build --release -p lyco-spine-render

      # The binary is only useful if it runs, so exercise the parts an operator
      # would touch before handing it over.
      - name: smoke test the binary
        shell: bash
        run: |
          set -euo pipefail
          ./target/release/lyco-cli.exe --version
          d="$(mktemp -d)"
          ./target/release/lyco-cli.exe skin template --out "$d/skin.png"
          ./target/release/lyco-cli.exe skin validate "$d/skin.png"
          ./target/release/lyco-cli.exe skin fix-overlay "$d/skin.png" --out "$d/fixed.png"
          ./target/release/lyco-cli.exe skin preview "$d/fixed.png" --out "$d/front.png" --scale 4
          test -s "$d/front.png"
          ./target/release/lyco-cli.exe kaggle --help
          ./target/release/lyco-cli.exe skin generate --help

      # Only the MIT binary. `lyco-spine-render.exe` is deliberately absent:
      # see the `build from source` workflow for why, and for how to get it.
      - uses: actions/upload-artifact@v4
        with:
          name: lyco-cli-windows
          path: target/release/lyco-cli.exe
          if-no-files-found: error
