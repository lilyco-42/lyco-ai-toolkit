name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      # Informational while the development machine cannot run rustfmt: a
      # formatting diff is reported but must never mask a real test failure.
      - name: fmt (informational)
        continue-on-error: true
        run: cargo fmt --all -- --check

      # Blocking gates. Tests are the primary gate: the geometry tables in
      # lyco-mc-skin are only trustworthy if these pass.
      - name: test
        run: cargo test --workspace --all-targets
      - name: clippy
        run: cargo clippy --workspace --all-targets
      - name: build
        run: cargo build --workspace

      - name: cli surface smoke test
        run: |
          set -euo pipefail
          ./target/debug/lyco-cli --version
          ./target/debug/lyco-cli --help
          # Scaffolded subcommands must fail fast until implemented, so that a
          # green pipeline can never imply assets were actually produced.
          if ./target/debug/lyco-cli bundle --prompt x; then
            echo 'scaffold subcommands must fail fast until implemented'
            exit 1
          fi
