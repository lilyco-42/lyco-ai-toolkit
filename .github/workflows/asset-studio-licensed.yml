name: Licensed Asset Studio
on:
  pull_request:
    paths: ['.github/workflows/asset-studio-licensed.yml', 'docs/asset-studio-distribution.md']
  push:
    branches: [main]
    paths: ['.github/workflows/asset-studio-licensed.yml', 'docs/asset-studio-distribution.md']
  workflow_dispatch:
    inputs:
      app_commit:
        description: Reviewed full SHA from lilyco-42/lilyco
        required: true
        type: string
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: asset-studio-licensed-${{ github.ref }}
  cancel-in-progress: true
env:
  APP_COMMIT: ${{ inputs.app_commit || 'a308ad03671a2b8d415b85ff2d7e2e7bfc42796b' }}
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Validate pinned application revision
        shell: bash
        run: '[[ "$APP_COMMIT" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@v4
        with:
          repository: lilyco-42/lilyco
          ref: ${{ env.APP_COMMIT }}
          path: asset-app
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            asset-app -> target
          key: asset-studio-licensed
          cache-on-failure: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build the actual shadcn workspace
        working-directory: asset-app/apps/asset-studio/ui
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Check and build the existing Spine engine
        shell: bash
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked -p lyco-spine-render --all-targets -- -D warnings
          cargo test --locked -p lyco-spine-render -p lyco-spine
          cargo build --locked --release -p lyco-spine-render
      - name: Check and build the existing AIC engine
        working-directory: asset-app
        shell: bash
        run: |
          cargo test -p lilyco-aic --no-default-features --features android
          cargo build --locked --release -p lilyco-aic --no-default-features --features android
      - name: Install the local app and acceptance dependencies
        run: python -m pip install -r asset-app/apps/asset-studio/requirements.txt httpx==0.28.1 pillow==11.3.0 pyinstaller==6.16.0
      - name: Integrate both trusted engines
        shell: bash
        run: |
          mkdir -p asset-app/apps/asset-studio/bin
          EXT=""; if [ "$RUNNER_OS" = "Windows" ]; then EXT=".exe"; fi
          cp "target/release/lyco-spine-render${EXT}" "asset-app/apps/asset-studio/bin/lyco-spine-render${EXT}"
          cp "asset-app/target/release/laic${EXT}" "asset-app/apps/asset-studio/bin/laic${EXT}"
          echo "LAIN42_LAIC=$GITHUB_WORKSPACE/asset-app/apps/asset-studio/bin/laic${EXT}" >> "$GITHUB_ENV"
          echo "LAIN42_LYCO_SPINE_RENDER=$GITHUB_WORKSPACE/asset-app/apps/asset-studio/bin/lyco-spine-render${EXT}" >> "$GITHUB_ENV"
          echo "SPINE_SOURCE_ROOT=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
      - name: Real AIC and Spine animation/export, isolation and cancellation
        working-directory: asset-app/apps/asset-studio
        run: python -m unittest discover -s tests -v
      - name: Desktop and phone-size real playback
        if: runner.os == 'Linux'
        working-directory: asset-app/apps/asset-studio
        shell: bash
        run: |
          python tests/fixture.py tests/demo.pxls
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
          python -m uvicorn 'studio.app:create_app' --factory --host 127.0.0.1 --port 8043 > /tmp/asset-studio-ui.log 2>&1 &
          PID=$!
          trap 'kill "$PID" || true' EXIT
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:8043/ >/dev/null && break || sleep .25; done
          node tests/ui.mjs
      - name: Build the complete local application
        working-directory: asset-app/apps/asset-studio
        run: python packaging/build-app.py
      - name: Preserve licenses and dependency notices
        working-directory: asset-app/apps/asset-studio
        run: python tests/notices.py
      - name: Exercise both bundled engines from the actual package
        working-directory: asset-app/apps/asset-studio
        run: python tests/bundle_smoke.py dist/Lain42-Asset-Studio/Lain42-Asset-Studio${{ runner.os == 'Windows' && '.exe' || '' }}
        env:
          EXPECT_SPINE: 'true'
      - name: Create the verified integrated product archive
        working-directory: asset-app/apps/asset-studio
        shell: bash
        run: |
          cp ../../LICENSE README.md THIRD-PARTY-NOTICES.json SPINE-RUNTIME-LICENSE.html dist/Lain42-Asset-Studio/
          cp "$GITHUB_WORKSPACE/LICENSE" dist/Lain42-Asset-Studio/SPINE-TOOL-SOURCE-LICENSE
          cp "$GITHUB_WORKSPACE/Cargo.lock" dist/Lain42-Asset-Studio/SPINE-Cargo.lock
          cp ../../Cargo.lock dist/Lain42-Asset-Studio/AIC-Cargo.lock
          cp ui/package-lock.json dist/Lain42-Asset-Studio/UI-package-lock.json
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp MICROSOFT-WEBVIEW2-LICENSE.txt dist/Lain42-Asset-Studio/
            cp packaging/webview2-sdk.json dist/Lain42-Asset-Studio/webview2-sdk.json
          fi
          python - <<'PY'
          import hashlib,json,os,pathlib,zipfile
          root=pathlib.Path('dist/Lain42-Asset-Studio')
          manifest={'commit':os.environ['APP_COMMIT'],'spine_source_commit':os.environ['GITHUB_SHA'],'spine_runtime_revision':'4ff8b7280aeb7367f235752c30dc85184c01452a','runner':os.environ['RUNNER_OS'],'contains_spine_runtime':True,'runtime_license':'Spine Runtimes License Agreement','files':{p.relative_to(root).as_posix():hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file()}}
          manifest['release_id']=hashlib.sha1((manifest['commit']+'\n'+manifest['spine_source_commit']).encode()).hexdigest()
          (root/'manifest.json').write_text(json.dumps(manifest,indent=2),encoding='utf-8')
          target=pathlib.Path('dist')/('lain42-asset-studio-'+os.environ['RUNNER_OS'].lower()+'.zip')
          with zipfile.ZipFile(target,'w',zipfile.ZIP_DEFLATED) as archive:
              for p in root.rglob('*'):
                  if p.is_file(): archive.write(p,p.relative_to(root.parent).as_posix())
          target.with_suffix('.zip.sha256').write_text(hashlib.sha256(target.read_bytes()).hexdigest()+'\n',encoding='ascii')
          summary={'app_commit':os.environ['APP_COMMIT'],'spine_source_commit':os.environ['GITHUB_SHA'],'platform':os.environ['RUNNER_OS'].lower(),'sha256':hashlib.sha256(target.read_bytes()).hexdigest(),'size':target.stat().st_size,'contains_spine_runtime':True}
          summary['release_id']=manifest['release_id']
          (target.parent/'package-evidence.json').write_text(json.dumps(summary,indent=2),encoding='utf-8')
          print(json.dumps(summary))
          PY
      - name: Prepare Windows native acceptance and installer tools
        if: runner.os == 'Windows'
        working-directory: asset-app/apps/asset-studio
        shell: pwsh
        run: |
          npm install --no-save playwright@1.56.1
          python tests/fixture.py tests/demo.pxls
          choco install nsis -y --no-progress
          Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile webview2-bootstrap.exe
          $signature = Get-AuthenticodeSignature webview2-bootstrap.exe
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Microsoft Corporation') { throw 'Invalid WebView2 bootstrap signature' }
          $setup = Start-Process ./webview2-bootstrap.exe -ArgumentList '/silent','/install' -Wait -PassThru -WindowStyle Hidden
          if ($setup.ExitCode -notin 0,3010) { throw "WebView2 install failed: $($setup.ExitCode)" }
      - name: Verify real packaged WebView2, export and normal close
        if: runner.os == 'Windows'
        working-directory: asset-app/apps/asset-studio
        run: node tests/desktop_smoke.mjs dist/Lain42-Asset-Studio/Lain42-Asset-Studio.exe
      - name: Build and exercise the Windows installation EXE
        if: runner.os == 'Windows'
        working-directory: asset-app/apps/asset-studio
        run: |
          python packaging/windows-installer.py
          python tests/installer_smoke.py
        env:
          EXPECT_SPINE: 'true'
      - name: Preserve failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: asset-studio-failure-${{ runner.os }}-${{ github.sha }}
          path: asset-app/apps/asset-studio/evidence/
      - uses: actions/upload-artifact@v4
        with:
          name: asset-studio-licensed-${{ runner.os }}-${{ github.sha }}
          if-no-files-found: error
          path: |
            asset-app/apps/asset-studio/dist/*.zip
            asset-app/apps/asset-studio/dist/*.sha256
            asset-app/apps/asset-studio/dist/*-setup.exe
            asset-app/apps/asset-studio/ui/package-lock.json
            asset-app/apps/asset-studio/dist/package-evidence.json
            asset-app/apps/asset-studio/evidence/*
